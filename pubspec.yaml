name: bunly
description: Bunly mobile architecture base for milestone 2.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.35.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  supabase_flutter: 2.10.3
  drift: 2.28.2
  drift_flutter: 0.2.5
  uuid: 4.5.1

dev_dependencies:
